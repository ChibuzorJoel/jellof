<div class="live-chat-widget">
  
    <!-- Chat Button (When Closed) -->
    <button class="chat-button" 
            *ngIf="!isOpen" 
            (click)="toggleChat()"
            [class.has-unread]="unreadCount > 0">
      
      <!-- Chat Icon -->
      <svg class="chat-icon" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
      </svg>
  
      <!-- Unread Badge -->
      <span class="unread-badge" *ngIf="unreadCount > 0">{{ unreadCount }}</span>
  
      <!-- Pulse Animation -->
      <span class="pulse-ring"></span>
    </button>
  
    <!-- Chat Window -->
    <div class="chat-window" *ngIf="isOpen" [class.minimized]="isMinimized">
      
      <!-- Chat Header -->
      <div class="chat-header">
        <div class="agent-info">
          <div class="agent-avatar">
            <img src="https://ui-avatars.com/api/?name=JELLOF+Support&background=2d5016&color=fff" alt="Agent">
            <span class="status-indicator" [class.online]="agentStatus === 'online'"></span>
          </div>
          <div class="agent-details">
            <h4>{{ agentName }}</h4>
            <p class="status-text">
              <span class="status-dot" [class.online]="agentStatus === 'online'"></span>
              {{ agentStatus === 'online' ? 'Online' : 'Offline' }}
            </p>
          </div>
        </div>
  
        <!-- Header Actions -->
        <div class="header-actions">
          <button class="header-btn" (click)="minimizeChat()" title="Minimize">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
          </button>
          <button class="header-btn" (click)="closeChat()" title="Close">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>
      </div>
  
      <!-- Chat Body -->
      <div class="chat-body" *ngIf="!isMinimized">
        
        <!-- Messages Container -->
        <div class="chat-messages">
          
          <!-- Welcome Banner -->
          <div class="welcome-banner" *ngIf="messages.length === 0">
            <div class="banner-icon">👋</div>
            <h3>Welcome to JELLOF!</h3>
            <p>How can we help you today?</p>
            
            <!-- Quick Actions -->
            <div class="quick-actions">
              <button class="quick-action-btn" (click)="messageText = 'I need help with shipping'; sendMessage()">
                📦 Shipping Info
              </button>
              <button class="quick-action-btn" (click)="messageText = 'What is your return policy?'; sendMessage()">
                ↩️ Returns
              </button>
              <button class="quick-action-btn" (click)="messageText = 'I need help with my order'; sendMessage()">
                🛒 Track Order
              </button>
              <button class="quick-action-btn" (click)="messageText = 'Tell me about sizing'; sendMessage()">
                📏 Size Guide
              </button>
            </div>
          </div>
  
          <!-- Messages -->
          <div class="message" 
               *ngFor="let message of messages"
               [class.user-message]="message.sender === 'user'"
               [class.agent-message]="message.sender === 'agent'">
            
            <!-- Agent Avatar -->
            <div class="message-avatar" *ngIf="message.sender === 'agent'">
              <img src="https://ui-avatars.com/api/?name=JELLOF&background=2d5016&color=fff" alt="Agent">
            </div>
  
            <!-- Message Content -->
            <div class="message-content">
              <div class="message-bubble">
                {{ message.text }}
              </div>
              <span class="message-time">{{ getTimeString(message.timestamp) }}</span>
            </div>
          </div>
  
          <!-- Agent Typing Indicator -->
          <div class="message agent-message" *ngIf="isAgentTyping">
            <div class="message-avatar">
              <img src="https://ui-avatars.com/api/?name=JELLOF&background=2d5016&color=fff" alt="Agent">
            </div>
            <div class="message-content">
              <div class="typing-indicator">
                <span></span>
                <span></span>
                <span></span>
              </div>
            </div>
          </div>
        </div>
  
        <!-- Chat Footer -->
        <div class="chat-footer">
          
          <!-- Message Input -->
          <div class="message-input-container">
            <textarea 
              class="message-input"
              [(ngModel)]="messageText"
              (keypress)="onKeyPress($event)"
              placeholder="Type your message..."
              rows="1"
              name="chatMessage"></textarea>
            
            <!-- Send Button -->
            <button 
              class="send-btn" 
              (click)="sendMessage()"
              [disabled]="!messageText.trim()">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="22" y1="2" x2="11" y2="13"></line>
                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
              </svg>
            </button>
          </div>
  
          <!-- Footer Info -->
          <div class="chat-footer-info">
            <p>We typically reply within a few minutes</p>
          </div>
        </div>
      </div>
  
      <!-- Minimized Preview -->
      <div class="minimized-preview" *ngIf="isMinimized">
        <p>Chat minimized. Click to expand.</p>
      </div>
    </div>
  
    <!-- Powered By -->
    <div class="powered-by" *ngIf="isOpen && !isMinimized">
      <small>Powered by JELLOF Chat</small>
    </div>
  </div>
