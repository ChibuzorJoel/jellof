<div class="cart-notification-overlay" *ngIf="isVisible" (click)="closeNotification()">
    <div class="cart-notification-popup" (click)="$event.stopPropagation()">
      
      <!-- Success Icon -->
      <div class="success-icon">
        <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10" stroke="#2d5016" fill="#e8f5e9"></circle>
          <path d="M9 12l2 2 4-4" stroke="#2d5016" stroke-linecap="round" stroke-linejoin="round"></path>
        </svg>
      </div>
  
      <!-- Close Button -->
      <button class="notification-close" (click)="closeNotification()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
  
      <!-- Title -->
      <h3 class="notification-title">Added to Cart!</h3>
      <p class="notification-message">Your item has been successfully added to your cart</p>
  
      <!-- Product Info -->
      <div class="notification-product" *ngIf="product">
        <div class="product-image-wrapper">
          <img [src]="product.image" [alt]="product.name" class="product-image">
        </div>
        <div class="product-details">
          <h4 class="product-name">{{ product.name }}</h4>
          <p class="product-category">{{ product.category }}</p>
          <p class="product-price">${{ product.price.toFixed(2) }}</p>
        </div>
      </div>
  
      <!-- Action Buttons -->
      <div class="notification-actions">
        <button class="btn-continue" (click)="continueShopping()">
          Continue Shopping
        </button>
        <button class="btn-view-cart" (click)="goToCart()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="9" cy="21" r="1"></circle>
            <circle cx="20" cy="21" r="1"></circle>
            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
          </svg>
          View Cart
        </button>
      </div>
  
      <!-- Progress Bar -->
      <div class="auto-close-progress">
        <div class="progress-bar"></div>
      </div>
    </div>
  </div>
