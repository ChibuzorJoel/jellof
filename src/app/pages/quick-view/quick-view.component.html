<div class="quick-view-overlay" *ngIf="isOpen" (click)="closeModal()">
  <div class="quick-view-modal" (click)="$event.stopPropagation()" *ngIf="product">
    
    <!-- Close Button -->
    <button class="close-btn" (click)="closeModal()">✕</button>

    <div class="modal-content">
      
      <!-- Left: Images -->
      <div class="product-images">
        <div class="main-image-container">
          <!-- CLICKABLE IMAGE -->
          <img 
            [src]="images[currentImageIndex]" 
            [alt]="product.name || 'Product'" 
            class="main-image clickable"
            (click)="viewProductDetail()">
          
          <!-- Navigation Arrows -->
          <button 
            class="nav-btn prev" 
            (click)="previousImage()"
            *ngIf="images.length > 1 && currentImageIndex > 0">
            ‹
          </button>
          <button 
            class="nav-btn next" 
            (click)="nextImage()"
            *ngIf="images.length > 1 && currentImageIndex < images.length - 1">
            ›
          </button>
        </div>

        <!-- Thumbnail Images -->
        <div class="thumbnail-images" *ngIf="images.length > 1">
          <img 
            *ngFor="let image of images; let i = index"
            [src]="image" 
            [alt]="product.name || 'Product thumbnail'"
            class="thumbnail"
            [class.active]="i === currentImageIndex"
            (click)="selectImage(i)">
        </div>
      </div>

      <!-- Right: Product Details -->
      <div class="product-details">
        
        <!-- Category & Title -->
        <div class="product-header">
          <span class="product-category">{{ product.category || 'Product' }}</span>

          <!-- CLICKABLE TITLE -->
          <h2 
            class="product-title clickable" 
            (click)="viewProductDetail()">
            {{ product.name || 'Product Name' }}
          </h2>

          <div class="product-price-container">
            <span class="product-price">
              ${{ product.price ? product.price.toFixed(2) : '0.00' }}
            </span>
          </div>
        </div>

        <!-- Description -->
        <div class="product-description">
          <p>{{ product.description || 'No description available' }}</p>
        </div>

        <!-- View Full Details Button -->
        <div class="view-details-btn">
          <button 
            class="btn-view-details"
            (click)="viewProductDetail()">
            View Full Details
          </button>
        </div>

        <!-- Color Selection -->
        <div class="product-options" *ngIf="product.colors && product.colors.length > 0">
          <label class="option-label">Color:</label>
          <div class="color-options">
            <button 
              *ngFor="let color of product.colors"
              class="color-btn"
              [class.selected]="selectedColor === color"
              [style.background-color]="color"
              [title]="color"
              (click)="selectColor(color)">
            </button>
          </div>
        </div>

        <!-- Size Selection -->
        <div class="product-options" *ngIf="product.sizes && product.sizes.length > 0">
          <label class="option-label">Size:</label>
          <div class="size-options">
            <button 
              *ngFor="let size of product.sizes"
              class="size-btn"
              [class.selected]="selectedSize === size"
              (click)="selectSize(size)">
              {{ size }}
            </button>
          </div>
        </div>

        <!-- Quantity -->
        <div class="quantity-section">
          <label class="option-label">Quantity:</label>
          <div class="quantity-controls">
            <button class="qty-btn" (click)="decreaseQuantity()">−</button>
            <input type="number" [(ngModel)]="quantity" min="1" max="99" class="qty-input" name="quantity">
            <button class="qty-btn" (click)="increaseQuantity()">+</button>
          </div>
        </div>

        <!-- Action Buttons -->
        <div class="action-buttons">
          <button 
            class="btn-add-to-cart" 
            (click)="addToCart()"
            [disabled]="!product.inStock">
            Add to Cart
          </button>
          
          <button 
            class="btn-buy-now" 
            (click)="buyNow()"
            [disabled]="!product.inStock">
            Buy Now
          </button>
        </div>

      </div>

    </div>
  </div>
</div>
